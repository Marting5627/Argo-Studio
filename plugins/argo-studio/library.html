<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Argo Studio</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--raised:#f5f5f7;--text:#202124;--muted:#7b7d82;--line:#e5e5e7;--accent:#008bff;--selected:#e5f2ff;--danger:#b84b31;font-family:"Argo Harmony","Argo Harmony SC","HarmonyOS Sans","HarmonyOS Sans SC",sans-serif;font-size:13px}
@media(prefers-color-scheme:dark){:root{--bg:#181818;--raised:#252525;--text:#eee;--muted:#a4a4a7;--line:#383838;--selected:#16334d;--danger:#ffae8c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit;color:inherit}button{cursor:pointer;border:1px solid transparent;background:var(--raised);border-radius:8px;min-height:32px;padding:5px 11px}button:hover{filter:brightness(.95)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button.primary{background:var(--accent);color:white}svg{width:17px;height:17px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7}header{display:flex;align-items:center;gap:10px;padding:15px 16px 12px;border-bottom:1px solid var(--line)}header .brand{width:27px;height:27px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;color:var(--accent);background:var(--raised);font-weight:700;font-size:18px}h1{margin:0;font-size:15px;font-weight:650}#project{font-size:11px;color:var(--muted);margin-top:2px;max-width:180px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.grow{flex:1;min-width:0}.icon{width:32px;padding:5px}#app{height:100dvh;min-height:300px;display:flex;flex-direction:column}.filters{padding:12px 16px 8px;display:grid;gap:10px}.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--muted)}.search input{border:0;outline:0;background:transparent;min-width:0;width:100%;font-size:12px}.tabs{display:flex;gap:3px;padding:3px;background:var(--raised);border-radius:8px}.tabs button{flex:1;min-height:27px;padding:3px 6px;background:transparent;font-size:12px}.tabs button[aria-pressed=true]{background:var(--bg);box-shadow:0 1px 3px #0001;color:var(--accent)}#message{margin:0 16px;font-size:12px;color:var(--muted);line-height:1.5;white-space:pre-wrap}#message.error{color:var(--danger)}#message:empty{display:none}main{min-height:0;flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:12px 16px}main::-webkit-scrollbar{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:15px 10px;align-content:start}.asset{border:0;border-radius:0;padding:0;background:transparent;text-align:left;min-width:0;color:var(--text);position:relative;align-self:start}.asset:hover{filter:none}.preview{aspect-ratio:4/3;display:grid;place-items:center;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--muted)}.preview img{width:100%;height:100%;object-fit:contain;display:block}.preview svg{width:26px;height:26px;opacity:.7}.asset[aria-pressed=true] .preview{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--selected)}.check{position:absolute;right:6px;top:6px;border:1.3px solid #fff;background:#3337;border-radius:50%;width:16px;height:16px;color:white;font-size:10px;display:grid;place-items:center}.asset[aria-pressed=true] .check{background:var(--accent);border-color:white}.name{font-size:12px;line-height:1.45;font-weight:500;margin-top:5px;white-space:normal;overflow-wrap:anywhere;display:block}.state{display:block;font-size:10px;line-height:1.35;color:var(--muted);margin-top:2px}.tag{position:absolute;left:5px;bottom:5px;background:#222a;color:#fff;border-radius:4px;padding:1px 4px;font-size:9px}.empty{min-height:180px;display:grid;place-content:center;justify-items:center;gap:9px;color:var(--muted);font-size:13px}.empty svg{width:34px;height:34px;opacity:.55}#more{display:block;margin:17px auto 5px;font-size:12px}#more[hidden]{display:none}footer{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg)}#selection{flex:1;font-size:11px;color:var(--muted)}#transfer{padding:10px 16px;border-top:1px solid var(--line);display:grid;gap:7px;font-size:12px}#transfer[hidden]{display:none}.transfer-row{display:flex;align-items:center;gap:10px}.transfer-row span{flex:1;overflow-wrap:anywhere}progress{width:100%;height:4px;accent-color:var(--accent)}#transferCancel{min-height:24px;font-size:11px;background:none;color:var(--muted);padding:1px 5px}.license{position:fixed;inset:16px;z-index:4;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 60px #0002;padding:15px;gap:12px}.license[hidden]{display:none}.license pre{flex:1;min-height:0;overflow:auto;white-space:pre-wrap;font:inherit;font-size:11px;line-height:1.6;margin:0}.license h2{font-size:14px;margin:0}.license button{align-self:flex-end}.subtle{background:none;font-size:10px;color:var(--muted);padding:0;min-height:20px}.bottom{padding:0 16px 5px;text-align:right}@media(max-width:270px){header,.filters,main,footer{padding-left:10px;padding-right:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header .brand{display:none}#selection{display:none}}
</style>
<style>#playerOpenGroup[hidden]{display:none}</style>
<style>
#contextMenu{position:fixed;z-index:10;min-width:150px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:9px;box-shadow:0 5px 20px #0003}#contextMenu[hidden]{display:none}#contextMenu button{width:100%;text-align:left;background:transparent}#contextMenu button:hover{background:var(--raised)}
</style>
<style>
#player{position:fixed;z-index:20;top:50%;transform:translateY(-50%);left:12px;right:12px;max-height:calc(100dvh - 24px);overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg);box-shadow:0 12px 45px #0004}#player[hidden]{display:none}#playerBackdrop{position:fixed;inset:0;z-index:19;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);background:#00000008}#playerBackdrop[hidden]{display:none}#player header{padding:10px;gap:7px}#playerTitle{font-weight:600;overflow-wrap:anywhere;min-width:0}#player .player-body{padding:0 10px 10px}#player video,#player img{display:block;width:100%;max-height:65dvh;object-fit:contain;background:#111;border-radius:7px}#player audio{display:block;width:100%}#playerStatus{font-size:12px;color:var(--muted);margin:10px 0 0;white-space:pre-wrap}#playerStatus:empty{display:none}#playerProgress[hidden]{display:none}#playerClose{font-size:21px;line-height:1;flex:0 0 30px;min-height:30px;padding:2px}#playerWays{font-size:12px;white-space:nowrap}
</style>
<style>
#scroll{overscroll-behavior-y:contain}#playerOpenGroup{display:flex;align-items:center;flex:none;border:1px solid var(--line);border-radius:18px;background:var(--raised)}#playerOpenGroup button{background:transparent;min-height:30px;height:30px}#playerOpenDefault{display:flex;align-items:center;gap:6px;border-radius:18px 0 0 18px;padding:4px 8px 4px 10px}#playerOpenDefault img,#playerOpenMenu img{width:18px;height:18px;object-fit:contain}#playerWays{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:0 18px 18px 0;border-left:1px solid var(--line);padding:0;line-height:0}#playerWays svg{display:block;width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#playerOpenMenu{position:absolute;z-index:22;right:42px;top:45px;min-width:180px;max-width:calc(100% - 55px);max-height:45dvh;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 8px 25px #0003}#playerOpenMenu::-webkit-scrollbar{display:none}#playerOpenMenu[hidden]{display:none}#playerOpenMenu button{display:flex;align-items:center;gap:7px;text-align:left;width:100%;background:transparent;padding:6px 8px;overflow-wrap:anywhere}#playerOpenMenu button:hover{background:var(--raised)}#playerOpenMenu .native-file{border-top:1px solid var(--line);border-radius:0;margin-top:3px}
</style>
<style>
#player .player-actions{justify-content:flex-end;padding:10px;border-top:1px solid var(--line)}#player{scrollbar-width:none}#player::-webkit-scrollbar{display:none}
#libraryFooter{gap:6px;flex-wrap:wrap}#libraryFooter .reference-actions{display:flex;gap:6px}#libraryFooter button{font-size:12px;padding:5px 8px;white-space:nowrap}#libraryImport{margin-left:auto}#libraryFooter #selection{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}#refresh{display:grid;place-items:center;line-height:0}#refresh svg{display:block;stroke-linecap:round;stroke-linejoin:round}#refresh[aria-busy=true] svg{animation:refresh-spin .8s linear infinite}@keyframes refresh-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#refresh[aria-busy=true] svg{animation:none}}
</style>

<script>
'use strict';
const $=id=>document.getElementById(id), selected=new Map(), previews=new Map(), pending=new Map();
let serial=0,ready=false,kind='all',revision='',projectRef='',nextOffset=null,items=[],busy=false,epoch=0,refreshTimer,searchTimer,bridgeContext={},transfer=null,thumbnailJobs=[],thumbnailActive=0,displayKey='',refreshPending=false,forceRefreshPending=false,selectionImporting=false,pluginHost=null;
let connectionBlocked=false,messageKind='',detectedProject=null,promptedProject='',switchingProject=false;
const icon={image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m3 17 5-5 4 4 3-3 6 6"/>',video:'<rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-4v12l-5-4"/>',audio:'<path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/>'};
function protocolError(value){const error=new Error(value?.message||'客户端请求失败');if(Number.isSafeInteger(value?.code))error.code=value.code;return error}
function rpc(method,params={},timeout=30000){const id=++serial;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error('连接暂未返回，请刷新核对。'))},timeout);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
function notify(method,params={}){window.parent.postMessage({jsonrpc:'2.0',method,params},'*')}
function payload(value){if(value?.structuredContent){return value.structuredContent.result??value.structuredContent}for(const part of value?.content??[]){if(part.type!=='text')continue;try{const data=JSON.parse(part.text);if(data&&typeof data==='object')return data.result??data}catch{}}return {}}
function textError(value){const data=payload(value);if(typeof data.summary==='string')return data.summary.slice(0,180);const text=value?.content?.find(x=>x.type==='text'&&!/^\s*[\[{]/.test(x.text))?.text;return typeof text==='string'?text.split('\n')[0].slice(0,180):'Argo暂不可用，请确认已打开工程并启用MCP。'}
async function tool(name,args={}){const result=await rpc('tools/call',{name,arguments:args},name==='argo_operation_status'?1860000:name==='argo_switch_project'?330000:45000);if(result?.isError){const state=payload(result);if(['argo_assets_dimportAttachment','argo_operation_status','argo_operation_cancel'].includes(name)&&['cancelled','denied'].includes(state.status)&&/^argo-operation-[0-9a-f-]{36}$/i.test(state.operationRef??''))return result;throw new Error(textError(result))}return result}
function message(text,error=false,category='operation'){messageKind=category;$('message').textContent=text;$('message').classList.toggle('error',error)}
function connectionMessage(error){
 const text=error.message||'连接暂不可用。';
 if(error.code===-32010||/Argo Host.*(?:退出|不可用)|stdio连接保留/.test(text))return '等待 Argo 重新连接。';
 if(error.code===-32011||/本机MCP已被关闭/.test(text))return '本地连接已关闭，请在 Argo 中开启。';
 if(error.code===-32012&&/撤销/.test(text))return '连接已撤销，请在 Argo 中重新连接。';
 if(error.code===-32016&&/宿主选择已变化/.test(text))return '连接目标已更换，请重新加载插件。';
 return text;
}
async function clearDisconnectedLibrary(label='未连接'){
 epoch++;items=[];revision='';projectRef='';nextOffset=null;displayKey='';thumbnailJobs=[];previews.clear();selected.clear();
 contextItem=null;detectedProject=null;$('contextMenu').hidden=true;$('projectNotice').hidden=true;$('project').textContent=label;
 const closing=closePlayback();render();await closing;
}
async function checkCompatibility(){const host=payload(await tool('argo_plugin_status'));const required=['compatibility.handshake.v1','objects.canonical.v1','library.read.v1','library.reference.v1','library.media.original.v1','library.media.video-frames.v1','library.preview.chunks.v1','attachment.transfer.v1','attachment.import.receipt.v1','approval.client.form.v1','session.reconnect.v1'];if(host.schemaVersion!==1||host.businessVersion!==1||host.panelVersion!==1||!Array.isArray(host.capabilities)||required.some(x=>!host.capabilities.includes(x)))throw new Error('此 Argo 与素材面板不兼容，请升级宿主或使用兼容插件。');pluginHost=host;$('project').title=`Argo ${host.applicationVersion} · ${host.build}\n${host.applicationPath}\n插件 ${host.pluginVersion}`;$('playerOpenGroup').hidden=!host.capabilities.includes('library.openWith.v1')}
function safeThumbnail(value){return typeof value==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(value)&&value.length<90000?value:null}
function selection(){const count=selected.size;$('selection').textContent=count?`已选择 ${count} 项`:'未选择素材';$('copy').disabled=$('reference').disabled=!count||!!transfer||selectionImporting||connectionBlocked;$('libraryImport').disabled=!count||!!transfer||selectionImporting||connectionBlocked;$('import').disabled=connectionBlocked}
function referenceContent(values){return values.map(value=>({type:'resource_link',uri:value.uri,name:value.canonicalReference,title:value.canonicalReference,mimeType:value.mimeType,size:value.byteCount,_meta:{'openai/group':{title:value.canonicalReference},'argo/reference':{target:value.target,sourceRevision:value.sourceRevision,sha256:value.sha256}}}))}
async function currentLibraryItem(item,scope=projectRef){const data=payload(await tool('argo_library_list',{query:item.canonicalReference,kind:'all',offset:0}));const matches=(data.items||[]).filter(value=>value.assetID===item.assetID&&value.canonicalReference===item.canonicalReference&&(!item.sourceRevision||value.sourceRevision===item.sourceRevision));if(data.projectRef!==scope||matches.length!==1)throw new Error('素材或工程已变化，请重新选择。');return matches[0]}
function render(){
 const grid=$('grid');grid.replaceChildren();
 if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.style.gridColumn='1/-1';empty.innerHTML='<svg viewBox="0 0 24 24">'+icon.image+'</svg>';const label=document.createElement('span');label.textContent=connectionBlocked?'等待连接':ready?'暂无素材':'正在连接…';empty.append(label);grid.append(empty)}
 for(const item of items){
  const b=document.createElement('button');b.className='asset';b.title=item.canonicalReference;b.setAttribute('aria-label',item.canonicalReference);b.setAttribute('aria-pressed',String(selected.has(item.uri)));
  const p=document.createElement('span');p.className='preview';const cached=previews.get(item.uri);
  if(cached?.src){const img=document.createElement('img');img.alt='';img.src=cached.src;p.append(img)}else p.innerHTML='<svg viewBox="0 0 24 24">'+(icon[item.kind]||icon.image)+'</svg>';
  const check=document.createElement('span');check.className='check';check.textContent=selected.has(item.uri)?'✓':'';p.append(check);
  if(item.kind!=='image'){const tag=document.createElement('span');tag.className='tag';tag.textContent=item.kind==='video'?'视频':'音频';p.append(tag)}
  const n=document.createElement('span');n.className='name';n.textContent=item.canonicalReference;b.append(p,n);
  if(cached?.availability==='authorizationRequired'){const s=document.createElement('span');s.className='state';s.textContent='需要重新授权';b.append(s)}
  b.onclick=event=>{if(event.detail>1||connectionBlocked)return;if(selected.has(item.uri))selected.delete(item.uri);else if(selected.size<32)selected.set(item.uri,item);else message('每次最多引用32项。');b.setAttribute('aria-pressed',String(selected.has(item.uri)));check.textContent=selected.has(item.uri)?'✓':'';selection()};
  b.ondblclick=()=>{if(!connectionBlocked)openPlayback(item)};
  b.oncontextmenu=event=>{event.preventDefault();if(connectionBlocked)return;contextItem=item;const menu=$('contextMenu');$('playInPage').textContent=item.kind==='image'?'在新页面查看':'在新页面播放';menu.hidden=false;menu.style.left=Math.max(0,Math.min(event.clientX,innerWidth-menu.offsetWidth-6))+'px';menu.style.top=Math.max(0,Math.min(event.clientY,innerHeight-menu.offsetHeight-6))+'px';$('playInPage').focus()};
  grid.append(b)
 }
 $('more').hidden=nextOffset===null;selection()
}
let contextItem=null,openingPlayback=false,hostCapabilities={};
async function openPlaybackPage(item){
 $('contextMenu').hidden=true;if(openingPlayback)return;
 if(!hostCapabilities.experimental?.['openai/files']){message('当前客户端不支持打开播放页面。',true);return}
 openingPlayback=true;
 try{const result=await tool('argo_library_open',{uri:item.uri}),path=result._meta?.playback?.path;if(typeof path!=='string'||!path.startsWith('/'))throw new Error('没有取得已授权的播放文件。');await rpc('openai/files/open',{path});message('已打开：'+payload(result).canonicalReference)}
 catch(e){message('未能播放：'+e.message,true)}finally{openingPlayback=false}

}
