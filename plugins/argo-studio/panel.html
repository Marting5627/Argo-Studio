<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Argo Studio</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--raised:#f5f5f7;--text:#202124;--muted:#7b7d82;--line:#e5e5e7;--accent:#008bff;--selected:#e5f2ff;--danger:#b84b31;font-family:"Argo Harmony","Argo Harmony SC","HarmonyOS Sans","HarmonyOS Sans SC",sans-serif;font-size:13px}
@media(prefers-color-scheme:dark){:root{--bg:#181818;--raised:#252525;--text:#eee;--muted:#a4a4a7;--line:#383838;--selected:#16334d;--danger:#ffae8c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit;color:inherit}button{cursor:pointer;border:1px solid transparent;background:var(--raised);border-radius:8px;min-height:32px;padding:5px 11px}button:hover{filter:brightness(.95)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button.primary{background:var(--accent);color:white}svg{width:17px;height:17px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7}header{display:flex;align-items:center;gap:10px;padding:15px 16px 12px;border-bottom:1px solid var(--line)}header .brand{width:27px;height:27px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;color:var(--accent);background:var(--raised);font-weight:700;font-size:18px}h1{margin:0;font-size:15px;font-weight:650}#project{font-size:11px;color:var(--muted);margin-top:2px;max-width:180px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.grow{flex:1;min-width:0}.icon{width:32px;padding:5px}#app{height:100dvh;min-height:300px;display:flex;flex-direction:column}.filters{padding:12px 16px 8px;display:grid;gap:10px}.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--muted)}.search input{border:0;outline:0;background:transparent;min-width:0;width:100%;font-size:12px}.tabs{display:flex;gap:3px;padding:3px;background:var(--raised);border-radius:8px}.tabs button{flex:1;min-height:27px;padding:3px 6px;background:transparent;font-size:12px}.tabs button[aria-pressed=true]{background:var(--bg);box-shadow:0 1px 3px #0001;color:var(--accent)}#message{margin:0 16px;font-size:12px;color:var(--muted);line-height:1.5;white-space:pre-wrap}#message.error{color:var(--danger)}#message:empty{display:none}main{min-height:0;flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:12px 16px}main::-webkit-scrollbar{display:none}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 10px;align-content:start}.asset{border:0;border-radius:0;padding:0;background:transparent;text-align:left;min-width:0;color:var(--text);position:relative;align-self:start}.asset:hover{filter:none}.preview{aspect-ratio:4/3;display:grid;place-items:center;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--muted)}.preview img{width:100%;height:100%;object-fit:contain;display:block}.preview svg{width:26px;height:26px;opacity:.7}.asset[aria-pressed=true] .preview{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--selected)}.check{position:absolute;right:6px;top:6px;border:1.3px solid #fff;background:#3337;border-radius:50%;width:16px;height:16px;color:white;font-size:10px;display:grid;place-items:center}.asset[aria-pressed=true] .check{background:var(--accent);border-color:white}.name{font-size:12px;line-height:1.45;font-weight:500;margin-top:5px;white-space:normal;overflow-wrap:anywhere;display:block}.state{display:block;font-size:10px;line-height:1.35;color:var(--muted);margin-top:2px}.tag{position:absolute;left:5px;bottom:5px;background:#222a;color:#fff;border-radius:4px;padding:1px 4px;font-size:9px}.empty{min-height:180px;display:grid;place-content:center;justify-items:center;gap:9px;color:var(--muted);font-size:13px}.empty svg{width:34px;height:34px;opacity:.55}#more{display:block;margin:17px auto 5px;font-size:12px}#more[hidden]{display:none}footer{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg)}#selection{flex:1;font-size:11px;color:var(--muted)}#transfer{padding:10px 16px;border-top:1px solid var(--line);display:grid;gap:7px;font-size:12px}#transfer[hidden]{display:none}.transfer-row{display:flex;align-items:center;gap:10px}.transfer-row span{flex:1;overflow-wrap:anywhere}progress{width:100%;height:4px;accent-color:var(--accent)}#transferCancel{min-height:24px;font-size:11px;background:none;color:var(--muted);padding:1px 5px}.license{position:fixed;inset:16px;z-index:4;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 60px #0002;padding:15px;gap:12px}.license[hidden]{display:none}.license pre{flex:1;min-height:0;overflow:auto;white-space:pre-wrap;font:inherit;font-size:11px;line-height:1.6;margin:0}.license h2{font-size:14px;margin:0}.license button{align-self:flex-end}.subtle{background:none;font-size:10px;color:var(--muted);padding:0;min-height:20px}.bottom{padding:0 16px 5px;text-align:right}@media(max-width:270px){header,.filters,main,footer{padding-left:10px;padding-right:10px}header .brand{display:none}#selection{display:none}}
#playerMedia video::-webkit-media-controls-fullscreen-button{display:none!important}
</style>
<style>#playerOpenGroup[hidden]{display:none}</style>
<style>
#contextMenu{position:fixed;z-index:10;min-width:150px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:9px;box-shadow:0 5px 20px #0003}#contextMenu[hidden]{display:none}#contextMenu button{width:100%;text-align:left;background:transparent}#contextMenu button:hover{background:var(--raised)}
</style>
<style>
#player{position:fixed;z-index:20;top:50%;transform:translateY(-50%);left:12px;right:12px;max-height:calc(100dvh - 24px);overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg);box-shadow:0 12px 45px #0004}#player[hidden]{display:none}#playerBackdrop{position:fixed;inset:0;z-index:19;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);background:#00000008}#playerBackdrop[hidden]{display:none}#player header{padding:10px;gap:7px}#playerTitle{font-weight:600;overflow-wrap:anywhere;min-width:0}#player .player-body{padding:0 10px 10px}#playerMedia video,#playerMedia img{display:block;width:100%;max-height:65dvh;object-fit:contain;background:#111;border-radius:7px}#player audio{display:block;width:100%}#playerStatus{font-size:12px;color:var(--muted);margin:10px 0 0;white-space:pre-wrap}#playerStatus:empty{display:none}#playerProgress[hidden]{display:none}#playerClose{font-size:21px;line-height:1;flex:0 0 30px;min-height:30px;padding:2px}#playerWays{font-size:12px;white-space:nowrap}
</style>
<style>
#player[data-presentation=page]{inset:0;transform:none;width:100%;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none;display:flex;flex-direction:column;overflow:hidden}#player[data-presentation=page]>header{flex:none;min-width:0}#player[data-presentation=page] .player-body{display:flex;flex-direction:column;flex:1;min-height:0;gap:8px;overflow:hidden}#player[data-presentation=page] #playerMedia{display:flex;align-items:center;justify-content:center;flex:1;min-width:0;min-height:0;overflow:hidden;background:#111;border-radius:7px}#player[data-presentation=page] #playerMedia video,#player[data-presentation=page] #playerMedia img{width:100%;height:100%;min-width:0;min-height:0;max-height:100%;object-fit:contain;border-radius:0}#player[data-presentation=page] #playerStatus{flex:none;max-height:25dvh;overflow:auto;margin:0}#player[data-presentation=page] #playerProgress{flex:none}
</style>
<style>
#scroll{overscroll-behavior-y:contain}#playerOpenGroup{display:flex;align-items:center;flex:none;border:1px solid var(--line);border-radius:18px;background:var(--raised)}#playerOpenGroup button{background:transparent;min-height:30px;height:30px}#playerOpenDefault{display:flex;align-items:center;gap:6px;border-radius:18px 0 0 18px;padding:4px 8px 4px 10px}#playerOpenDefault img,#playerOpenMenu img{width:18px;height:18px;object-fit:contain}#playerWays{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:0 18px 18px 0;border-left:1px solid var(--line);padding:0;line-height:0}#playerWays svg{display:block;width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#playerOpenMenu{position:absolute;z-index:22;right:42px;top:45px;min-width:180px;max-width:calc(100% - 55px);max-height:45dvh;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 8px 25px #0003}#playerOpenMenu::-webkit-scrollbar{display:none}#playerOpenMenu[hidden]{display:none}#playerOpenMenu button{display:flex;align-items:center;gap:7px;text-align:left;width:100%;background:transparent;padding:6px 8px;overflow-wrap:anywhere}#playerOpenMenu button:hover{background:var(--raised)}
</style>
<style>
#player .player-actions{justify-content:flex-end;padding:10px;border-top:1px solid var(--line)}#player{scrollbar-width:none}#player::-webkit-scrollbar{display:none}
#libraryImport{margin-left:auto}#libraryFooter #selection{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}#refresh{display:grid;place-items:center;line-height:0}#refresh svg{display:block;stroke-linecap:round;stroke-linejoin:round}#refresh[aria-busy=true] svg{animation:refresh-spin .8s linear infinite}@keyframes refresh-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#refresh[aria-busy=true] svg{animation:none}}
</style>
<style>
#app>header{flex-shrink:0}
#player>header{border-bottom:0}
#playerOpenMenu{position:fixed;z-index:40;right:auto;min-width:0;max-width:none;max-height:320px;padding:5px;border-radius:15px;box-shadow:0 5px 22px #0002;overscroll-behavior:contain}
#playerOpenMenu button{min-height:36px;padding:7px 10px;border:0;border-radius:10px;font-size:13px;font-weight:400}
#playerOpenMenu button:hover,#playerOpenMenu button:focus-visible{background:var(--raised);filter:none;outline:none}
#playerOpenMenu .workspace-check{margin-left:auto;flex:none}
.preview .check .panel-icon-check{width:12px;height:12px;opacity:1}
.workspace-picker{position:relative;flex:none}
button.workspace-trigger{display:flex;align-items:center;gap:5px;height:32px;min-height:32px;padding:5px 10px;border:1px solid transparent;border-radius:8px;background:var(--raised);white-space:nowrap;font-size:13px;font-weight:500}
.workspace-trigger svg{width:12px;height:12px;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.workspace-menu{position:absolute;z-index:30;right:0;top:calc(100% + 7px);width:164px;max-width:calc(100vw - 24px);padding:5px;border:1px solid var(--line);border-radius:15px;background:var(--bg);box-shadow:0 5px 22px #0002}
.workspace-menu[hidden]{display:none}
.workspace-menu button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:36px;padding:7px 10px;border:0;border-radius:10px;background:transparent;text-align:left;font-size:13px;font-weight:400}
.workspace-menu button:hover,.workspace-menu button:focus-visible{background:var(--raised);filter:none;outline:none}
.workspace-check{font-size:16px;line-height:1;color:var(--muted);visibility:hidden}
.workspace-menu [aria-selected=true] .workspace-check{visibility:visible}
:root{--panel-footer-block:12px;--panel-footer-inline:16px;--panel-footer-gap:12px;--panel-action-height:32px;--panel-action-radius:8px;--panel-action-inline:9px;--panel-action-block:6px;--panel-action-font-size:12px;--panel-action-font-weight:400}
.panel-footer{display:flex;align-items:center;justify-content:space-between;flex:none;gap:var(--panel-footer-gap);padding:var(--panel-footer-block) var(--panel-footer-inline);border-top:1px solid var(--line);background:var(--bg)}
.panel-footer button{font:inherit;font-size:var(--panel-action-font-size);font-weight:var(--panel-action-font-weight);height:var(--panel-action-height);min-height:var(--panel-action-height);border-radius:var(--panel-action-radius);padding:var(--panel-action-block) var(--panel-action-inline);white-space:nowrap}
#libraryFooter{flex-wrap:nowrap}
#libraryFooter #copy{display:none}
#libraryFooter #libraryImport{margin-left:auto}
@media(max-width:270px){:root{--panel-footer-inline:10px}}
</style>
<style>
:root{--panel-space-1:4px;--panel-space-2:8px;--panel-space-3:12px;--panel-space-4:16px;--panel-inset:16px;--panel-label-width:76px;--panel-label-size:12px;--panel-control-height:32px;--panel-control-radius:8px;--panel-control-inline:10px;--panel-menu-inset:4px;--panel-menu-radius:15px;--panel-menu-row-height:36px;--panel-menu-row-radius:10px;--panel-footer-block:var(--panel-space-3);--panel-footer-inline:var(--panel-inset);--panel-footer-gap:var(--panel-space-3);--panel-action-height:var(--panel-control-height);--panel-action-radius:var(--panel-control-radius);--panel-action-inline:var(--panel-control-inline);--panel-action-block:6px}
button{min-height:var(--panel-control-height);border-radius:var(--panel-control-radius);padding:6px var(--panel-control-inline)}
#app>header{gap:var(--panel-space-2);padding:var(--panel-space-3) var(--panel-inset)}#app>header .brand{width:28px;height:28px;border-radius:var(--panel-control-radius)}#refresh{width:var(--panel-control-height);height:var(--panel-control-height);padding:var(--panel-space-1)}
button.workspace-trigger{gap:var(--panel-space-2);height:var(--panel-control-height);min-height:var(--panel-control-height);padding:6px var(--panel-control-inline);border-radius:var(--panel-control-radius)}
.filters{padding:var(--panel-space-3) var(--panel-inset) 0;gap:10px}.search{height:var(--panel-control-height);padding:0 var(--panel-control-inline);gap:var(--panel-space-2);border-radius:var(--panel-control-radius)}.search input{font-size:12px}
.tabs{height:var(--panel-control-height);gap:3px;padding:3px;background:var(--raised);border-radius:var(--panel-control-radius)}.tabs button{height:calc(var(--panel-control-height) - 6px);min-height:calc(var(--panel-control-height) - 6px);padding:3px 6px;font-size:12px}.tabs button[aria-pressed=true]{background:var(--bg);box-shadow:0 1px 3px #0001;color:var(--accent)}
.filters{flex-shrink:0}.library-viewport{position:relative;isolation:isolate;display:flex;flex:1;min-height:0;padding-top:var(--panel-space-2);overflow:hidden;background:var(--bg)}
.library-viewport::before,.library-viewport::after{content:"";position:absolute;z-index:1;left:0;right:0;height:3px;pointer-events:none;opacity:0}.library-viewport::before{top:var(--panel-space-2);background:linear-gradient(to bottom,var(--bg),transparent)}.library-viewport::after{bottom:0;background:linear-gradient(to top,var(--bg),transparent)}.library-viewport[data-fade-top=true]::before,.library-viewport[data-fade-bottom=true]::after{opacity:1}
#scroll{padding:0 var(--panel-inset) var(--panel-space-4);min-height:0;flex:1}.grid{gap:var(--panel-space-3)}.preview{border-radius:var(--panel-control-radius)}.name{margin-top:var(--panel-space-1);line-height:1.5}.preview .state{display:block;margin:0;padding:var(--panel-space-2);font-size:12px;line-height:1.4;text-align:center;color:var(--muted)}#message{margin:0 var(--panel-inset)}#more{margin:var(--panel-space-4) auto 0}
.workspace-menu,#playerOpenMenu,#contextMenu{padding:var(--panel-menu-inset);border-radius:var(--panel-menu-radius);box-shadow:0 5px 22px #0002}.workspace-menu{top:calc(100% + var(--panel-space-2))}
.workspace-menu button,#playerOpenMenu button,#contextMenu button{min-height:var(--panel-menu-row-height);padding:var(--panel-space-2) var(--panel-space-3);border-radius:var(--panel-menu-row-radius);font-size:13px;font-weight:400}
#player>header{padding:var(--panel-space-3);gap:var(--panel-space-2)}#player .player-body{padding:0 var(--panel-space-3) var(--panel-space-3)}#transfer{padding:var(--panel-space-3) var(--panel-inset);gap:var(--panel-space-2)}
@media(max-width:270px){:root{--panel-inset:10px;--panel-label-width:64px}}
</style>
</head>
